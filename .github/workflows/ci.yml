name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  spec:
    # A gem serve app em Ruby 3.2 em diante, e a suíte roda em todas essas versões: o erro mais
    # provável aqui é usar um método que só existe numa delas.
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.2", "3.3", "3.4" ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - run: bundle exec rubocop
